<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/secret-santa/" />
  <title>Secret Santa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 16px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #111827);
      min-height: 100vh;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .subtitle { color: var(--hub-text-muted, #6b7280); font-size: 0.9rem; margin: 4px 0 20px; }
    .card {
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 12px);
      padding: 18px;
      margin-bottom: 12px;
    }
    .card.clickable { cursor: pointer; transition: border-color .15s; }
    .card.clickable:hover { border-color: var(--hub-primary, #111827); }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .spread { justify-content: space-between; }
    .btn {
      background: var(--hub-primary, #111827); color: var(--hub-primary-fg, #fff);
      border: none; border-radius: calc(var(--hub-radius, 12px) - 4px);
      padding: 9px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: var(--hub-primary-hover, #374151); }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn.ghost {
      background: transparent; color: var(--hub-text, #111827);
      border: 1px solid var(--hub-border, #d1d5db);
    }
    .btn.ghost:hover { background: var(--hub-bg, #f3f4f6); }
    .btn.danger { background: #b91c1c; color: #fff; }
    .btn.small { padding: 6px 12px; font-size: 0.8rem; }
    .chip {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    }
    .chip.open     { background: #dcfce7; color: #166534; }
    .chip.drawn    { background: #fef3c7; color: #92400e; }
    .chip.revealed { background: #dbeafe; color: #1e40af; }
    .chip.archived { background: #e5e7eb; color: #4b5563; }
    .meta { color: var(--hub-text-muted, #6b7280); font-size: 0.85rem; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; flex: none;
    }
    .participant { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--hub-border, #f3f4f6); }
    .participant:last-child { border-bottom: none; }
    .hint-text { color: var(--hub-text-muted, #6b7280); font-size: 0.82rem; }
    .assignment-card {
      text-align: center; padding: 26px 18px;
      border: 2px dashed var(--hub-primary, #111827);
    }
    .assignment-name { font-size: 1.6rem; font-weight: 800; margin: 6px 0; }
    .section-title { font-size: 1.02rem; font-weight: 700; margin: 22px 0 10px; }
    textarea, input[type="text"], input[type="date"], input[type="number"] {
      width: 100%; padding: 9px 11px; font: inherit; font-size: 0.9rem;
      border: 1px solid var(--hub-border, #d1d5db);
      border-radius: calc(var(--hub-radius, 12px) - 4px);
      background: var(--hub-surface, #fff); color: var(--hub-text, #111827);
    }
    textarea { min-height: 74px; resize: vertical; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin: 12px 0 5px; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal {
      background: var(--hub-surface, #fff); border-radius: var(--hub-radius, 12px);
      padding: 22px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1.15rem; margin-bottom: 4px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .banner {
      background: #fef9c3; border: 1px solid #fde047; color: #713f12;
      border-radius: var(--hub-radius, 12px); padding: 10px 14px;
      font-size: 0.85rem; margin-bottom: 14px;
    }
    .empty { text-align: center; color: var(--hub-text-muted, #6b7280); padding: 36px 12px; }
    .back { background: none; border: none; color: var(--hub-text-muted, #6b7280); font: inherit; font-size: 0.85rem; cursor: pointer; padding: 0; margin-bottom: 12px; }
    details.archived-list summary { cursor: pointer; color: var(--hub-text-muted, #6b7280); font-size: 0.88rem; margin: 18px 0 10px; }
    .reveal-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--hub-border, #f3f4f6); font-size: 0.92rem; }
    .reveal-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container" id="app"><p class="meta">Loading…</p></div>

  <script type="module">
    import { memberColor, initial, esc, hubConfirm, hubAlert, sendHubNotification, hubAppUrl } from "/hub-sdk.js";
    import {
      canManageExchange as _canManage, canJoin as _canJoin, canLeave as _canLeave,
      myParticipant as _myParticipant, myAssignment as _myAssignment,
      buildAssignments, drawError, statusLabel, fmtBudget, parseBudgetInput,
    } from "./logic.js";

    const CONTEXT = window.__CONTEXT_URL ?? "";
    const DB      = window.__DB_URL      ?? "";
    const APP_ID  = window.__APP_ID      ?? "secret-santa";
    const ME      = window.__CURRENT_MEMBER ?? null;

    const T = {
      exchanges:    "app_secret_santa__exchanges",
      participants: "app_secret_santa__participants",
      assignments:  "app_secret_santa__assignments",
      giftNotes:    "app_secret_santa__gift_notes",
      reveals:      "app_secret_santa__reveals",
    };

    let members = [], memberMap = new Map();
    let exchanges = [], participants = [], assignments = [], reveals = [], giftNotes = [];
    let currentExchangeId = null;
    let modalEl = null;
    const demo = !DB;

    async function db(sql, params = []) {
      if (!DB) return { rows: [] };
      const res = await fetch(DB, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params }),
      });
      const json = await res.json();
      if (!res.ok || json.error) throw new Error(json.error || `DB error (${res.status})`);
      return json;
    }

    // ── Data loading ─────────────────────────────────────────────────────────
    async function loadMembers() {
      if (!CONTEXT) {
        members = [
          { id: "demo-1", name: "Alex",  role: "adult" },
          { id: "demo-2", name: "Sam",   role: "adult" },
          { id: "demo-3", name: "Casey", role: "child" },
          { id: "demo-4", name: "Riley", role: "child" },
        ];
        memberMap = new Map(members.map(m => [m.id, m]));
        return;
      }
      try {
        const res = await fetch(`${CONTEXT}?keys=family.members`);
        members = ((await res.json())["family.members"]) ?? [];
      } catch { members = []; }
      memberMap = new Map(members.map(m => [m.id, m]));
    }

    async function loadData() {
      if (demo) {
        exchanges = [{
          id: "demo-x", title: "Holiday Gift Exchange", details: "Wrapped gifts under the tree by the 24th!",
          budget_cents: 2500, exchange_date: "2026-12-24", status: "drawn",
          created_by: "demo-1", created_at: new Date().toISOString(), drawn_at: new Date().toISOString(),
        }];
        participants = members.map((m, i) => ({
          id: `demo-p${i}`, exchange_id: "demo-x", member_id: m.id,
          visibility: "everyone", hint: i === 2 ? "Loves dinosaurs and LEGO" : null,
          created_at: new Date().toISOString(),
        }));
        assignments = []; reveals = []; giftNotes = [];
        return;
      }
      const [x, p, a, r, n] = await Promise.all([
        db(`SELECT * FROM ${T.exchanges} ORDER BY created_at DESC`),
        db(`SELECT * FROM ${T.participants}`),
        db(`SELECT * FROM ${T.assignments}`),
        db(`SELECT * FROM ${T.reveals}`),
        db(`SELECT * FROM ${T.giftNotes}`), // owner_only: returns only my own notes
      ]);
      exchanges = x.rows; participants = p.rows;
      assignments = a.rows; reveals = r.rows; giftNotes = n.rows;
    }

    // ── State-bound wrappers around pure logic ───────────────────────────────
    const canManage = () => _canManage(ME);
    const exchangeById = id => exchanges.find(x => x.id === id) ?? null;
    const participantsOf = x => participants.filter(p => p.exchange_id === x.id);
    const revealsOf = x => reveals.filter(r => r.exchange_id === x.id);
    const myNote = x => giftNotes.find(n => n.exchange_id === x.id && n.member_id === ME?.id) ?? null;

    function memberName(id) { return memberMap.get(id)?.name ?? "Former member"; }

    function avatarHtml(id) {
      const m = memberMap.get(id);
      return `<span class="avatar" style="background:${memberColor(id, members)}">${esc(initial(m?.name ?? "?"))}</span>`;
    }

    // ── Side effects ─────────────────────────────────────────────────────────
    function logHubActivity(type, description, exchangeId) {
      fetch("/api/activity", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type, actor: ME?.name ?? "Someone", description,
          metadata: { deepLink: { appId: APP_ID, params: { exchangeId } } },
        }),
      }).catch(() => {});
    }

    function notify(title, body, audience, exchangeId) {
      Promise.resolve(
        sendHubNotification({ title, body, audience, url: hubAppUrl(APP_ID, { exchangeId }) })
      ).catch(() => {});
    }

    // ── Modal helpers ────────────────────────────────────────────────────────
    function openModal(html) {
      closeModal();
      modalEl = document.createElement("div");
      modalEl.className = "modal-backdrop";
      modalEl.innerHTML = `<div class="modal">${html}</div>`;
      modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
      document.body.appendChild(modalEl);
      modalEl.querySelector("[data-autofocus]")?.focus();
    }
    function closeModal() { modalEl?.remove(); modalEl = null; }
    window.closeModal = closeModal;

    // ── Exchange create / edit ───────────────────────────────────────────────
    window.openExchangeModal = function(existingId) {
      const x = existingId ? exchangeById(existingId) : null;
      openModal(`
        <h2>${x ? "Edit exchange" : "New gift exchange"}</h2>
        <p class="meta">Anyone in the household can join while it's open.</p>
        <label>Name</label>
        <input type="text" id="f-title" data-autofocus maxlength="80" value="${x ? esc(x.title) : ""}" placeholder="Holiday Gift Exchange" />
        <label>Budget (optional, $)</label>
        <input type="number" id="f-budget" min="1" step="0.01" value="${x?.budget_cents ? (x.budget_cents / 100) : ""}" placeholder="25" />
        <label>Exchange date (optional)</label>
        <input type="date" id="f-date" value="${x?.exchange_date ? esc(x.exchange_date) : ""}" />
        <label>Details (optional)</label>
        <textarea id="f-details" maxlength="500" placeholder="Where, when, wrapping rules…">${x?.details ? esc(x.details) : ""}</textarea>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitExchange(${x ? `'${x.id}'` : "null"})">${x ? "Save" : "Create"}</button>
        </div>
      `);
    };

    window.submitExchange = async function(existingId) {
      const title = document.getElementById("f-title").value.trim();
      if (!title) { document.getElementById("f-title").focus(); return; }
      const budget  = parseBudgetInput(document.getElementById("f-budget").value);
      const date    = document.getElementById("f-date").value || null;
      const details = document.getElementById("f-details").value.trim() || null;

      const btn = modalEl?.querySelector(".modal-actions .btn-primary");
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      try {
        const now = new Date().toISOString();
        if (existingId) {
          await db(`UPDATE ${T.exchanges} SET title = ?, budget_cents = ?, exchange_date = ?, details = ? WHERE id = ?`,
            [title, budget, date, details, existingId]);
          const i = exchanges.findIndex(x => x.id === existingId);
          if (i !== -1) exchanges[i] = { ...exchanges[i], title, budget_cents: budget, exchange_date: date, details };
        } else {
          const id = crypto.randomUUID();
          await db(`INSERT INTO ${T.exchanges} (id, title, details, budget_cents, exchange_date, status, created_by, created_at) VALUES (?, ?, ?, ?, ?, 'open', ?, ?)`,
            [id, title, details, budget, date, ME?.id ?? "system", now]);
          exchanges = [{ id, title, details, budget_cents: budget, exchange_date: date, status: "open", created_by: ME?.id, created_at: now }, ...exchanges];
          currentExchangeId = id;
          logHubActivity("exchange_created", `${ME?.name ?? "Someone"} started a gift exchange: "${title}"`, id);
          notify(`🎁 New gift exchange: ${title}`, "Tap to join before the draw!", "all", id);
        }
        closeModal();
        render();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = existingId ? "Save" : "Create"; }
        hubAlert("Couldn't save the exchange.", { description: e.message });
      }
    };

    // ── Join / leave / hint ──────────────────────────────────────────────────
    window.joinExchange = async function(exchangeId) {
      if (!ME) return;
      const btn = document.getElementById("join-btn");
      if (btn) { btn.disabled = true; btn.textContent = "Joining…"; }
      try {
        const id = crypto.randomUUID();
        const now = new Date().toISOString();
        await db(`INSERT INTO ${T.participants} (id, exchange_id, member_id, visibility, created_at) VALUES (?, ?, ?, 'everyone', ?)`,
          [id, exchangeId, ME.id, now]);
        participants = [...participants, { id, exchange_id: exchangeId, member_id: ME.id, visibility: "everyone", hint: null, created_at: now }];
        render();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Join"; }
        hubAlert("Couldn't join.", { description: e.message });
      }
    };

    window.leaveExchange = async function(exchangeId) {
      if (!ME) return;
      const p = _myParticipant(exchangeById(exchangeId), participants, ME);
      if (!p) return;
      if (!(await hubConfirm({ message: "Leave this exchange?", confirmLabel: "Leave" }))) return;
      try {
        await db(`DELETE FROM ${T.participants} WHERE id = ?`, [p.id]);
        participants = participants.filter(q => q.id !== p.id);
        render();
      } catch (e) { hubAlert("Couldn't leave.", { description: e.message }); }
    };

    window.saveHint = async function(exchangeId) {
      const p = _myParticipant(exchangeById(exchangeId), participants, ME);
      if (!p) return;
      const hint = document.getElementById("f-hint").value.trim() || null;
      const btn = document.getElementById("hint-btn");
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      try {
        await db(`UPDATE ${T.participants} SET hint = ? WHERE id = ?`, [hint, p.id]);
        const i = participants.findIndex(q => q.id === p.id);
        if (i !== -1) participants[i] = { ...participants[i], hint };
        render();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Save hint"; }
        hubAlert("Couldn't save your hint.", { description: e.message });
      }
    };

    // ── The draw ─────────────────────────────────────────────────────────────
    window.runDraw = async function(exchangeId, isRedraw) {
      const x = exchangeById(exchangeId);
      if (!x || !canManage()) return;
      const ids = participantsOf(x).map(p => p.member_id);
      const err = drawError(ids);
      if (err) { hubAlert(err); return; }

      const ok = await hubConfirm({
        message: isRedraw ? "Re-draw all names?" : `Draw names for ${ids.length} participants?`,
        description: isRedraw
          ? "Existing assignments will be discarded and everyone gets a new person."
          : "Names are matched randomly right now and stored so that only each giver can see who they got — nobody else, including you.",
        confirmLabel: isRedraw ? "Re-draw" : "Draw names",
      });
      if (!ok) return;

      try {
        if (isRedraw) await db(`DELETE FROM ${T.assignments} WHERE exchange_id = ?`, [exchangeId]);
        // The pairing exists only inside this function and is never rendered.
        const pairs = buildAssignments(ids);
        const now = new Date().toISOString();
        for (const pair of pairs) {
          await db(`INSERT INTO ${T.assignments} (id, exchange_id, giver_id, receiver_id, created_at) VALUES (?, ?, ?, ?, ?)`,
            [crypto.randomUUID(), exchangeId, pair.giver_id, pair.receiver_id, now]);
        }
        await db(`UPDATE ${T.exchanges} SET status = 'drawn', drawn_at = ? WHERE id = ?`, [now, exchangeId]);

        const i = exchanges.findIndex(e => e.id === exchangeId);
        if (i !== -1) exchanges[i] = { ...exchanges[i], status: "drawn", drawn_at: now };
        // Mirror what the server would return to this caller: every receiver
        // masked except our own row.
        assignments = [
          ...assignments.filter(a => a.exchange_id !== exchangeId),
          ...pairs.map(p => ({
            id: crypto.randomUUID(), exchange_id: exchangeId, giver_id: p.giver_id,
            receiver_id: p.giver_id === ME?.id ? p.receiver_id : null, created_at: now,
          })),
        ];
        render();
        logHubActivity("draw_completed", `The hat was drawn for "${x.title}" 🎩`, exchangeId);
        notify(`🎩 Names are drawn for ${x.title}!`, "Open Secret Santa to see who you got. Shhh!", ids, exchangeId);
      } catch (e) {
        hubAlert("The draw didn't complete.", { description: `${e.message} — run the draw again to retry.` });
      }
    };

    // ── Reveal / archive / delete ────────────────────────────────────────────
    window.revealExchange = async function(exchangeId) {
      const x = exchangeById(exchangeId);
      if (!x || !canManage()) return;
      const ok = await hubConfirm({
        message: "Reveal who had whom?",
        description: "As each participant next opens the app, their pairing is published for everyone to see. This can't be undone.",
        confirmLabel: "Reveal",
      });
      if (!ok) return;
      try {
        const now = new Date().toISOString();
        await db(`UPDATE ${T.exchanges} SET status = 'revealed', revealed_at = ? WHERE id = ?`, [now, exchangeId]);
        const i = exchanges.findIndex(e => e.id === exchangeId);
        if (i !== -1) exchanges[i] = { ...exchanges[i], status: "revealed", revealed_at: now };
        await publishMyReveal(exchanges[i]);
        render();
        notify(`🎉 The big reveal: ${x.title}`, "Come see who had whom!", participantsOf(x).map(p => p.member_id), exchangeId);
      } catch (e) { hubAlert("Couldn't reveal.", { description: e.message }); }
    };

    // Each giver publishes their own pairing once the exchange is revealed —
    // the only pairing they can read (and reveals INSERTs are forced to the caller).
    async function publishMyReveal(x) {
      if (demo || !ME || !x || x.status !== "revealed") return;
      const mine = _myAssignment(x, assignments, ME);
      if (!mine) return;
      if (revealsOf(x).some(r => r.giver_id === ME.id)) return;
      try {
        const id = crypto.randomUUID();
        const now = new Date().toISOString();
        await db(`INSERT INTO ${T.reveals} (id, exchange_id, giver_id, receiver_id, visibility, created_at) VALUES (?, ?, ?, ?, 'everyone', ?)`,
          [id, x.id, ME.id, mine.receiver_id, now]);
        reveals = [...reveals, { id, exchange_id: x.id, giver_id: ME.id, receiver_id: mine.receiver_id, visibility: "everyone", created_at: now }];
      } catch { /* unique_per_member duplicate or transient — non-fatal */ }
    }

    window.archiveExchange = async function(exchangeId) {
      if (!canManage()) return;
      if (!(await hubConfirm({ message: "Archive this exchange?", confirmLabel: "Archive" }))) return;
      try {
        await db(`UPDATE ${T.exchanges} SET status = 'archived' WHERE id = ?`, [exchangeId]);
        const i = exchanges.findIndex(e => e.id === exchangeId);
        if (i !== -1) exchanges[i] = { ...exchanges[i], status: "archived" };
        currentExchangeId = null;
        render();
      } catch (e) { hubAlert("Couldn't archive.", { description: e.message }); }
    };

    window.deleteExchange = async function(exchangeId) {
      const x = exchangeById(exchangeId);
      if (!x || !canManage()) return;
      const ok = await hubConfirm({
        message: `Delete "${x.title}"?`,
        description: "Removes the exchange and its assignments for everyone. This can't be undone.",
        confirmLabel: "Delete", destructive: true,
      });
      if (!ok) return;
      try {
        await db(`DELETE FROM ${T.assignments} WHERE exchange_id = ?`, [exchangeId]);
        await db(`DELETE FROM ${T.exchanges} WHERE id = ?`, [exchangeId]);
        exchanges = exchanges.filter(e => e.id !== exchangeId);
        assignments = assignments.filter(a => a.exchange_id !== exchangeId);
        currentExchangeId = null;
        render();
      } catch (e) { hubAlert("Couldn't delete.", { description: e.message }); }
    };

    // ── Private gift notes ───────────────────────────────────────────────────
    window.saveNote = async function(exchangeId) {
      if (!ME) return;
      const body = document.getElementById("f-note").value.trim() || null;
      const btn = document.getElementById("note-btn");
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      try {
        const existing = myNote({ id: exchangeId });
        const now = new Date().toISOString();
        if (existing) {
          await db(`UPDATE ${T.giftNotes} SET body = ?, updated_at = ? WHERE id = ?`, [body, now, existing.id]);
          const i = giftNotes.findIndex(n => n.id === existing.id);
          if (i !== -1) giftNotes[i] = { ...giftNotes[i], body, updated_at: now };
        } else {
          const id = crypto.randomUUID();
          await db(`INSERT INTO ${T.giftNotes} (id, exchange_id, member_id, body, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?)`,
            [id, exchangeId, ME.id, body, now, now]);
          giftNotes = [...giftNotes, { id, exchange_id: exchangeId, member_id: ME.id, body, created_at: now, updated_at: now }];
        }
        if (btn) { btn.disabled = false; btn.textContent = "Saved ✓"; setTimeout(() => { if (btn.isConnected) btn.textContent = "Save note"; }, 1500); }
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Save note"; }
        hubAlert("Couldn't save your note.", { description: e.message });
      }
    };

    window.openWishlist = function() {
      window.parent.postMessage({ type: "hub:open", appId: "wishlist", params: {} }, "*");
    };

    window.openExchange = async function(id) {
      currentExchangeId = id;
      render();
      const x = exchangeById(id);
      if (x?.status === "revealed") { await publishMyReveal(x); render(); }
    };
    window.goBack = function() { currentExchangeId = null; render(); };

    // ── Rendering ────────────────────────────────────────────────────────────
    function render() {
      const app = document.getElementById("app");
      const x = currentExchangeId ? exchangeById(currentExchangeId) : null;
      app.innerHTML = x ? renderDetail(x) : renderList();
    }

    function renderList() {
      const active = exchanges.filter(x => x.status !== "archived");
      const archived = exchanges.filter(x => x.status === "archived");
      return `
        ${demo ? `<div class="banner">Demo mode — showing sample data. Install in your hub to run a real exchange.</div>` : ""}
        <div class="row spread">
          <div><h1>🎅 Secret Santa</h1><p class="subtitle">Gift exchanges where the draw stays secret — even from the organizer.</p></div>
          ${canManage() ? `<button class="btn" onclick="openExchangeModal(null)">New exchange</button>` : ""}
        </div>
        ${active.length === 0 ? `
          <div class="card empty">
            <div style="font-size:2rem">🎁</div>
            <p style="margin-top:8px">No gift exchanges yet.</p>
            ${canManage() ? `<p class="meta" style="margin-top:4px">Create one and let everyone join before the draw.</p>`
                          : `<p class="meta" style="margin-top:4px">Ask an adult to start one.</p>`}
          </div>` : active.map(exchangeCard).join("")}
        ${archived.length ? `
          <details class="archived-list">
            <summary>Archived (${archived.length})</summary>
            ${archived.map(exchangeCard).join("")}
          </details>` : ""}
      `;
    }

    function exchangeCard(x) {
      const ps = participantsOf(x);
      const bits = [
        `${ps.length} participant${ps.length === 1 ? "" : "s"}`,
        fmtBudget(x.budget_cents) ? `${fmtBudget(x.budget_cents)} budget` : null,
        x.exchange_date ? new Date(x.exchange_date + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) : null,
      ].filter(Boolean).join(" · ");
      return `
        <div class="card clickable" onclick="openExchange('${x.id}')">
          <div class="row spread">
            <strong>${esc(x.title)}</strong>
            <span class="chip ${esc(x.status)}">${esc(statusLabel(x))}</span>
          </div>
          <p class="meta" style="margin-top:6px">${esc(bits)}</p>
        </div>`;
    }

    function renderDetail(x) {
      const ps = participantsOf(x);
      const meIn = _myParticipant(x, participants, ME);
      const mine = _myAssignment(x, assignments, ME);
      const manage = canManage();
      const bits = [
        fmtBudget(x.budget_cents) ? `Budget: ${fmtBudget(x.budget_cents)}` : null,
        x.exchange_date ? `Exchange: ${new Date(x.exchange_date + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}` : null,
      ].filter(Boolean).join(" · ");

      return `
        <button class="back" onclick="goBack()">← All exchanges</button>
        <div class="row spread">
          <div>
            <h1>${esc(x.title)} <span class="chip ${esc(x.status)}">${esc(statusLabel(x))}</span></h1>
            ${bits ? `<p class="subtitle" style="margin-bottom:6px">${esc(bits)}</p>` : ""}
            ${x.details ? `<p class="meta">${esc(x.details)}</p>` : ""}
          </div>
        </div>

        ${renderAssignmentCard(x, mine)}
        ${x.status === "revealed" ? renderReveals(x, ps) : ""}

        <div class="section-title">Participants (${ps.length})</div>
        <div class="card">
          ${ps.length === 0 ? `<p class="meta">Nobody has joined yet.</p>` : ps.map(p => `
            <div class="participant">
              ${avatarHtml(p.member_id)}
              <div>
                <div>${esc(memberName(p.member_id))}${p.member_id === ME?.id ? ' <span class="meta">(you)</span>' : ""}</div>
                ${p.hint ? `<div class="hint-text">🎯 ${esc(p.hint)}</div>` : ""}
              </div>
            </div>`).join("")}
          ${x.status === "open" && ME ? `
            <div class="row" style="margin-top:12px">
              ${_canJoin(x, participants, ME) ? `<button class="btn" id="join-btn" onclick="joinExchange('${x.id}')">Join</button>` : ""}
              ${_canLeave(x, participants, ME) ? `<button class="btn ghost small" onclick="leaveExchange('${x.id}')">Leave</button>` : ""}
            </div>` : ""}
          ${x.status === "drawn" && ME && !meIn ? `<p class="meta" style="margin-top:10px">The draw already happened — you can't join this one.</p>` : ""}
        </div>

        ${meIn && x.status !== "archived" ? `
          <div class="section-title">Your gift hint <span class="meta" style="font-weight:400">(visible to everyone)</span></div>
          <div class="card">
            <textarea id="f-hint" maxlength="200" placeholder="Sizes, favorite things, allergies… help your Santa out!">${meIn.hint ? esc(meIn.hint) : ""}</textarea>
            <div class="row" style="margin-top:10px"><button class="btn small" id="hint-btn" onclick="saveHint('${x.id}')">Save hint</button></div>
          </div>` : ""}

        ${manage ? `
          <div class="section-title">Organizer</div>
          <div class="card">
            <div class="row">
              ${x.status === "open" ? `<button class="btn" onclick="runDraw('${x.id}', false)">🎩 Draw names</button>` : ""}
              ${x.status === "drawn" ? `
                <button class="btn" onclick="revealExchange('${x.id}')">🎉 Reveal pairings</button>
                <button class="btn ghost" onclick="runDraw('${x.id}', true)">Re-draw</button>` : ""}
              ${x.status !== "archived" ? `<button class="btn ghost" onclick="openExchangeModal('${x.id}')">Edit</button>` : ""}
              ${x.status !== "archived" ? `<button class="btn ghost" onclick="archiveExchange('${x.id}')">Archive</button>` : ""}
              <button class="btn danger" onclick="deleteExchange('${x.id}')">Delete</button>
            </div>
            ${x.status === "open" ? `<p class="meta" style="margin-top:10px">Assignments are stored so each person can only ever read their own — no one (you included) can query who has whom.</p>` : ""}
          </div>` : ""}
      `;
    }

    function renderAssignmentCard(x, mine) {
      if (x.status === "open" || x.status === "archived") return "";
      if (!ME || !_myParticipant(x, participants, ME)) return "";
      if (!mine) return `<div class="card"><p class="meta">The draw is done, but your assignment isn't loading. Try refreshing.</p></div>`;
      const r = memberMap.get(mine.receiver_id);
      const hint = participantsOf(x).find(p => p.member_id === mine.receiver_id)?.hint;
      const note = myNote(x);
      return `
        <div class="card assignment-card">
          <div class="meta">You're the Secret Santa for</div>
          <div class="assignment-name">🎁 ${esc(r?.name ?? "Former member")}</div>
          ${fmtBudget(x.budget_cents) ? `<div class="meta">Keep it around ${esc(fmtBudget(x.budget_cents))}</div>` : ""}
          ${hint ? `<div class="hint-text" style="margin-top:8px">🎯 Their hint: ${esc(hint)}</div>` : ""}
          <div class="row" style="justify-content:center;margin-top:14px">
            <button class="btn ghost small" onclick="openWishlist()">Browse their Wish List</button>
          </div>
        </div>
        <div class="section-title">Private gift ideas <span class="meta" style="font-weight:400">(only you can see this)</span></div>
        <div class="card">
          <textarea id="f-note" maxlength="1000" placeholder="Ideas, links, what you've bought…">${note?.body ? esc(note.body) : ""}</textarea>
          <div class="row" style="margin-top:10px"><button class="btn small" id="note-btn" onclick="saveNote('${x.id}')">Save note</button></div>
        </div>`;
    }

    function renderReveals(x, ps) {
      const rs = revealsOf(x);
      const published = new Set(rs.map(r => r.giver_id));
      const waiting = ps.filter(p => !published.has(p.member_id));
      return `
        <div class="section-title">The big reveal 🎉</div>
        <div class="card">
          ${rs.length === 0 ? `<p class="meta">No pairings published yet.</p>` : rs.map(r => `
            <div class="reveal-row">
              ${avatarHtml(r.giver_id)}
              <span><strong>${esc(memberName(r.giver_id))}</strong> was Santa for <strong>${esc(memberName(r.receiver_id))}</strong></span>
            </div>`).join("")}
          ${waiting.length ? `<p class="meta" style="margin-top:10px">Waiting on ${esc(waiting.map(p => memberName(p.member_id)).join(", "))} — their pairing appears when they next open the app.</p>` : ""}
        </div>`;
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    function handleDeepLink() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("exchangeId");
      if (id && exchangeById(id)) currentExchangeId = id;
    }

    (async () => {
      try {
        await Promise.all([loadMembers(), loadData()]);
        handleDeepLink();
        render();
        // Publish this member's pairing for any exchange already revealed.
        const revealed = exchanges.filter(e => e.status === "revealed");
        if (revealed.length) {
          await Promise.all(revealed.map(publishMyReveal));
          render();
        }
      } catch (e) {
        document.getElementById("app").innerHTML =
          `<div class="card"><strong>Something went wrong.</strong><p class="meta" style="margin-top:6px">${esc(e.message)}</p></div>`;
      }
    })();
  </script>
</body>
</html>
